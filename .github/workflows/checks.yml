name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f SKILL.md
          test -f README.md
          test -f LICENSE
          test -f NOTICE.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
      - name: Check skill frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('SKILL.md')
          text = p.read_text(encoding='utf-8')
          assert text.startswith('---'), 'SKILL.md must start with frontmatter'
          assert re.search(r'\n---\s*\n', text[3:]), 'SKILL.md frontmatter must close'
          assert 'name:' in text[:1000], 'name field missing'
          assert 'description:' in text[:2000], 'description field missing'
          print('SKILL.md basic validation passed')
          PY
      - name: Secret artifact smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          tracked = [Path(p) for p in Path('.').rglob('*') if '.git' not in p.parts and p.is_file()]

          high_risk_paths = []
          for p in tracked:
              name = p.name.lower()
              if name == '.env' or name.startswith('.env.'):
                  high_risk_paths.append(str(p))
              if re.fullmatch(r'.*mcp_auth.*\.json', name):
                  high_risk_paths.append(str(p))

          private_key_hits = []
          key_re = re.compile(r'BEGIN (RSA|OPENSSH|PRIVATE) KEY')
          for p in tracked:
              try:
                  text = p.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              if key_re.search(text):
                  private_key_hits.append(str(p))

          if high_risk_paths or private_key_hits:
              if high_risk_paths:
                  print('High-risk secret artifact paths found:')
                  for item in high_risk_paths:
                      print(f'  {item}')
              if private_key_hits:
                  print('Private key material found in:')
                  for item in private_key_hits:
                      print(f'  {item}')
              sys.exit(1)

          print('No high-risk secret artifacts found')
          PY
